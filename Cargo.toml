[package]
name = "gpui-devtools"
version = "0.3.0"
edition = "2024"
description = "Developer tools for inspecting and debugging GPUI applications"
license = "MIT"
repository = "https://github.com/joris-gallot/gpui-devtools"
keywords = ["gpui", "devtools", "inspector", "debugging"]
categories = ["development-tools::debugging", "gui"]
include = ["src/**", "assets/**", "README.md", "LICENSE"]

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.5", features = ["inspector"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.5", features = ["inspector", "test-support"] }

[workspace]
members = ["examples/basic"]
resolver = "2"
